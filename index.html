e cx=%22164.7%22 cy=%22436.9%22 r=%222.6%22 fill=%22rgba(197,160,89,.18)%22 stroke=%22none%22/%3E%3Ccircle cx=%22162.6%22 cy=%22423.9%22 r=%222.6%22 fill=%22rgba(197,160,89,.18)%22 stroke=%22none%22/%3E%3Ccircle cx=%22138.7%22 cy=%22394.0%22 r=%222.6%22 fill=%22rgba(197,160,89,.18)%22 stroke=%22none%22/%3E%3C/svg%3E");

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--pearl);font-family:var(--sans);color:var(--slate);-webkit-font-smoothing:antialiased}
::selection{background:#EADBB8;color:var(--charcoal)}
[contenteditable=true]:hover{outline:1px dashed rgba(166,132,70,.7);outline-offset:4px;border-radius:3px;cursor:text}
[contenteditable=true]:focus{outline:2px dashed var(--gold);outline-offset:4px;border-radius:3px}
a{color:inherit;text-decoration:none}
input,textarea,select,button{font-family:inherit}
@keyframes aokfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes aokspin{to{transform:rotate(360deg)}}
@keyframes aokfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aok-scroll::-webkit-scrollbar{width:10px;height:10px}
.aok-scroll::-webkit-scrollbar-thumb{background:rgba(30,32,34,.18);border-radius:10px}
.aok-link a{color:var(--gold-deep);text-decoration:underline;text-underline-offset:2px}
.aok-mapembed iframe{width:100%!important;height:100%!important;border:0!important;display:block}
img,iframe{max-width:100%}
.aok-btn{transition:transform .18s, box-shadow .2s, filter .2s}
.aok-fx-lift:hover{transform:translateY(-3px)}
.aok-fx-grow:hover{transform:scale(1.06)}
.aok-fx-glow:hover{box-shadow:0 0 0 4px rgba(223,194,134,.45)}
.aok-fx-shine:hover{filter:brightness(1.08)}
@keyframes aokshimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.aok-shimmer{background:linear-gradient(90deg,#B8944F,#1E2022,#DFC286,#1E2022,#B8944F);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:aokshimmer 4s linear infinite}
.aok-promo .aok-pov{opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s}
.aok-promo:hover .aok-pov{opacity:1;transform:translateY(0)}
.aok-flip{perspective:1100px}
.aok-flip-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.aok-flip.flipped .aok-flip-inner{transform:rotateY(180deg)}
.aok-flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;overflow:hidden}
.aok-flip-back{transform:rotateY(180deg)}
.aok-burger{display:none}
.aok-mobnav{display:none}
@container site (max-width:1024px){[style*="repeat(3"]{grid-template-columns:repeat(2,1fr)!important}[style*="repeat(4"]{grid-template-columns:repeat(2,1fr)!important}}
@container site (max-width:860px){
.aok-desknav{display:none!important}
.aok-burger{display:inline-flex!important}
.aok-mobnav.open{display:block!important}
}
@container site (max-width:760px){
[style*="grid-template-columns"]{grid-template-columns:1fr!important}
.aok-floatimg{float:none!important;width:100%!important;max-width:320px!important;margin:0 0 20px!important}
}
/* Viewport-based fallbacks — work on every browser, incl. older iOS/Android with no container-query support */
@media (max-width:1024px){[style*="repeat(3"]{grid-template-columns:repeat(2,1fr)!important}[style*="repeat(4"]{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:860px){
.aok-desknav{display:none!important}
.aok-burger{display:inline-flex!important}
.aok-mobnav.open{display:block!important}
}
@media (max-width:760px){
[style*="grid-template-columns"]{grid-template-columns:1fr!important}
[style*="grid-template-columns"]>*{min-width:0!important}
.aok-floatimg{float:none!important;width:100%!important;max-width:320px!important;margin:0 0 20px!important}
}
@media (max-width:520px){
html,body{font-size:15px}
}
/* Touch & small-screen niceties */
input,textarea,select{max-width:100%}
img{height:auto}
*{-webkit-tap-highlight-color:rgba(197,168,105,.25)}

/* ---------- Typography: editorial serif headings across the public site (incl. editor-built blocks) ---------- */
.aok-site :is(h1,h2,h3){font-family:var(--serif)!important;font-weight:600!important;font-size-adjust:.47;letter-spacing:-.005em!important}
.aok-site h1{line-height:1.04}
.aok-tt-a.is-block,.aok-tt-b.is-block{display:block}
.aok-tt-b,.aok-goldtext{background:linear-gradient(120deg,#8A6A2E 0%,#B8944F 38%,#C9A866 55%,#A68446 78%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.aok-tt-b,.aok-goldtext{color:var(--gold);-webkit-text-fill-color:currentColor}}

/* ---------- Decorative sky: pearl gradients + razor-thin gold star-map line art ---------- */
.aok-site{position:relative;isolation:isolate} /* own stacking context so the z-index:-1 sky sits above the page background */
.aok-sky{position:absolute;left:0;right:0;top:0;height:1320px;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    var(--starmap) -250px -200px/660px 660px no-repeat,
    var(--starmap) -330px 700px/720px 720px no-repeat,
    radial-gradient(48% 42% at 6% 14%,#FFF3DF 0%,rgba(255,243,223,0) 72%),
    radial-gradient(52% 58% at 78% 34%,#FFFFFF 0%,rgba(255,255,255,0) 70%),
    linear-gradient(180deg,#FBF9F5 0%,#F6F1E8 62%,var(--pearl) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}

/* ---------- Floating pill navbar ---------- */
.aok-header{position:sticky;z-index:500;margin-top:14px;padding:0 20px;pointer-events:none}
.aok-pill{pointer-events:auto;max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:9px 10px 9px 12px;border-radius:9999px;background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(197,168,105,.42);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -10px rgba(120,96,50,.22),0 2px 6px rgba(120,96,50,.06)}
.aok-brand{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.aok-brand-mark{display:inline-flex;border-radius:50%;filter:drop-shadow(0 4px 8px rgba(120,96,50,.25))}
.aok-brand-name{font:600 25px/1 var(--serif);letter-spacing:.005em;white-space:nowrap}
.aok-brand-sub{font:600 9.5px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:4px;white-space:nowrap}
.aok-navlinks{display:flex;align-items:center;gap:30px}
.aok-navlink{position:relative;cursor:pointer;font:500 15px var(--sans);color:var(--slate);padding:8px 1px;transition:color .2s}
.aok-navlink::after{content:'';position:absolute;left:50%;right:50%;bottom:1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-hi),var(--gold-lo));box-shadow:0 0 10px rgba(223,194,134,.95),0 0 3px rgba(223,194,134,.9);
  opacity:0;transition:left .28s ease,right .28s ease,opacity .2s}
.aok-navlink:hover,.aok-navlink.is-active{color:var(--charcoal)}
